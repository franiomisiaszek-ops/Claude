# Render Blueprint for Cramless (https://render.com/docs/blueprint-spec).
# New → Blueprint → pick this repository. Values marked "sync: false" are asked for during setup.
services:
  - type: web
    name: cramless
    runtime: node
    plan: free
    rootDir: study-planner
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run serve
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # The site's public https address, e.g. https://cramless.onrender.com (set after the first deploy).
      - key: PUBLIC_URL
        sync: false
      # Supabase → Connect → "Session pooler" connection string (with your database password filled in).
      - key: DATABASE_URL
        sync: false
      # Random secrets, generated by Render. Keep them; changing them signs everyone out / disconnects Google.
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      # Optional features: leave empty to keep them off.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_DAILY_LIMIT
        value: "10"
      - key: AI_MONTHLY_BUDGET_USD
        value: "4"
      - key: AI_USER_MONTHLY_USD
        value: "1"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      # Your own (verified) email: shows the owner status card in Settings.
      - key: ADMIN_EMAILS
        sync: false
