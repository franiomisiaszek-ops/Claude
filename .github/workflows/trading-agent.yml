name: trading-agent

on:
  push:
    paths:
      - "trading-agent/**"
      - ".github/workflows/trading-agent.yml"
  pull_request:
    paths:
      - "trading-agent/**"
      - ".github/workflows/trading-agent.yml"

permissions:
  contents: read

concurrency:
  group: trading-agent-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: trading-agent

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # Makes the database tests run on PostgreSQL as well as SQLite.
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/test  # secret-scanner: allow (throwaway CI database)
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: trading-agent/uv.lock
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Formatting
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Tests
        run: uv run pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the freeze commit is needed to build system A's image
      - name: Build system A's frozen image, as in docs/EXPERIMENT.md
        run: |
          git worktree add ../../papertrader-a-frozen e54f521
          docker build -t papertrader:a-frozen ../../papertrader-a-frozen/trading-agent
          git worktree remove ../../papertrader-a-frozen
      - name: Build and start all services
        run: docker compose up -d --build --wait --wait-timeout 240
      - name: Startup checks inside the app containers
        run: |
          docker compose exec -T app papertrader check
          docker compose exec -T app-b papertrader check
          docker compose exec -T app-c papertrader check
      - name: The web app answers, but shows nothing without a login
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8501/healthz)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8501/)" = 303
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example' http://127.0.0.1:8501/healthz)" = 400
      - name: Backup and restore inside the containers
        run: |
          docker compose exec -T backup sh /scripts/backup.sh now
          dump=$(docker compose exec -T backup sh -c 'ls -1 /backups/papertrader-*.dump | tail -n 1' | tr -d '\r')
          echo "restoring $dump"
          docker compose stop app app-b app-c hub web
          docker compose exec -T backup sh /scripts/restore.sh "$dump" --yes
          docker compose start app app-b app-c hub web
          docker compose exec -T app papertrader check
          docker compose exec -T app-b papertrader check
          docker compose exec -T app-c papertrader check
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down -v
