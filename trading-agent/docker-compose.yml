# Start everything:   docker compose up -d --build --remove-orphans
# Watch the logs:     docker compose logs -f app app-b hub
# Stop:               docker compose down        (your data is kept)
#
# The three-way experiment (see docs/EXPERIMENT.md):
#   app        System A, the original system, FROZEN: it runs the image "papertrader:a-frozen"
#              built once from the freeze commit (docs/EXPERIMENT.md says how), with
#              config/a.yaml. Never rebuilt during the experiment. Loads the shared market data.
#   app-b      System B: A's research plus a better decision layer, with config/b.yaml.
#   app-c      System C: the weekly ETF trend portfolio (gold, bonds, stock funds), with config/c.yaml.
#   hub        The one Telegram bot for all systems: sends their messages tagged [A] [B] [C]
#              and answers commands (/pnl B). Uses config.yaml.
#   db         PostgreSQL. Not reachable from outside Docker. A, B and C each have their own
#              tables in it (schemas public, sys_b, sys_c); the market data is shared.
#   web        The iPhone web app (docs/WEBAPP.md): A, B and C, login required. Listens on this
#              computer only (http://localhost:8501); Tailscale brings it to the iPhone over HTTPS.
#              Holds no API keys: only the database address.
#   backup     One database + model backup a day into the "backups" folder
#              (or BACKUP_DIR from .env, e.g. a OneDrive folder). See docs/WINDOWS.md.
# All trading is PAPER trading on three separate Alpaca paper accounts.

name: papertrader

# Container logs are capped at 5 x 10 MB per service, so months of running cannot fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-env: &env
  DATABASE_URL: postgresql+psycopg://papertrader:${POSTGRES_PASSWORD:-change-me}@db:5432/papertrader
  PAPERTRADER_CONFIG: /app/config.yaml
  DATA_DIR: /app/data
  REPORTS_DIR: /app/reports
  BACKUPS_DIR: /app/backups

x-base: &base
  restart: unless-stopped
  logging: *logging
  env_file:
    - path: .env
      required: false
  environment: *env
  volumes:
    - ./config.yaml:/app/config.yaml:ro   # edit config.yaml, then: docker compose restart
    - ./config:/app/config:ro             # the systems' own settings: a.yaml, b.yaml, c.yaml
    - appdata:/app/data
    - ./reports:/app/reports              # backtest reports appear in the "reports" folder
    - ${BACKUP_DIR:-./backups}:/app/backups:ro   # read-only: the app only checks backups are recent
  depends_on:
    db:
      condition: service_healthy

# One image for B, C, the hub and the web app. Only app-b builds it: when four services
# built the same image at once, Docker Desktop's builder could drop out ("error reading
# from server: EOF"). The others reuse the image app-b just built.
x-app: &app
  <<: *base
  image: papertrader:local
  pull_policy: never   # built on this computer, never downloaded

x-health: &health
  # Healthy while this system's heartbeat in the database is fresh.
  test: ["CMD", "python", "-m", "papertrader.healthcheck"]
  interval: 60s
  timeout: 10s
  retries: 3
  start_period: 30s
  start_interval: 3s

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: papertrader
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: papertrader
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U papertrader -d papertrader"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:   # system A, frozen
    <<: *base
    image: papertrader:a-frozen
    pull_policy: never   # built on this computer from the freeze commit, never downloaded
    environment:
      <<: *env
      SYSTEM: "A"
      PAPERTRADER_CONFIG: /app/config/a.yaml
    command: ["papertrader", "run"]
    healthcheck: *health

  app-b:
    <<: *app
    build: .   # the only service that builds papertrader:local (see x-app above)
    environment:
      <<: *env
      SYSTEM: "B"
      PAPERTRADER_CONFIG: /app/config/b.yaml
    command: ["papertrader", "run"]
    healthcheck: *health

  app-c:
    <<: *app
    environment:
      <<: *env
      SYSTEM: "C"
      PAPERTRADER_CONFIG: /app/config/c.yaml
    command: ["papertrader", "run"]
    healthcheck: *health

  hub:
    <<: *app
    command: ["papertrader", "hub"]

  web:   # the iPhone web app (X5): login required; no API keys, only the database address
    image: papertrader:local
    pull_policy: never   # app-b builds it
    restart: unless-stopped
    logging: *logging
    environment:
      DATABASE_URL: postgresql+psycopg://papertrader:${POSTGRES_PASSWORD:-change-me}@db:5432/papertrader
      PAPERTRADER_CONFIG: /app/config.yaml
      DATA_DIR: /app/data   # the password hash and the activity log live here
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./config:/app/config:ro
      - appdata:/app/data
    command: ["papertrader", "web", "serve", "--host", "0.0.0.0", "--port", "8501"]
    ports:
      - "127.0.0.1:8501:8501"   # only this computer; Tailscale serves it to your phone
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8501/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
      start_interval: 3s
    depends_on:
      db:
        condition: service_healthy

  backup:
    image: postgres:16-alpine   # the same version as the database, so pg_dump always matches
    restart: unless-stopped
    logging: *logging
    environment:
      PGHOST: db
      PGUSER: papertrader
      PGPASSWORD: ${POSTGRES_PASSWORD:-change-me}
      PGDATABASE: papertrader
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
      BACKUP_DIR: /backups
      DATA_DIR: /data
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
      - appdata:/data
      - ./scripts:/scripts:ro
    # Strip Windows line endings, just in case, then run the daily backup loop.
    entrypoint: ["sh", "-c", "tr -d '\\r' < /scripts/backup.sh > /tmp/backup.sh && exec sh /tmp/backup.sh"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  appdata:
