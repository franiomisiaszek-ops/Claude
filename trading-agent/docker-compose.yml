# Start everything:   docker compose up -d --build
# Watch the logs:     docker compose logs -f app
# Stop:               docker compose down        (your data is kept)
#
# Four services:
#   db         PostgreSQL. Not reachable from outside Docker.
#   app        The scheduler / trading service (PAPER trading only).
#   dashboard  Read-only web page at http://localhost:8501 (this computer only).
#   backup     One database + model backup a day into the "backups" folder
#              (or BACKUP_DIR from .env, e.g. a OneDrive folder). See docs/WINDOWS.md.

name: papertrader

# Container logs are capped at 5 x 10 MB per service, so months of running cannot fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app: &app
  build: .
  image: papertrader:local
  restart: unless-stopped
  logging: *logging
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+psycopg://papertrader:${POSTGRES_PASSWORD:-change-me}@db:5432/papertrader
    PAPERTRADER_CONFIG: /app/config.yaml
    DATA_DIR: /app/data
    REPORTS_DIR: /app/reports
    BACKUPS_DIR: /app/backups
  volumes:
    - ./config.yaml:/app/config.yaml:ro   # edit config.yaml, then: docker compose restart
    - appdata:/app/data
    - ./reports:/app/reports              # backtest reports appear in the "reports" folder
    - ${BACKUP_DIR:-./backups}:/app/backups:ro   # read-only: the app only checks backups are recent
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: papertrader
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: papertrader
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U papertrader -d papertrader"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    <<: *app
    command: ["papertrader", "run"]
    healthcheck:
      # Healthy while the heartbeat in the database is fresh.
      test: ["CMD", "python", "-m", "papertrader.healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
      start_interval: 3s

  dashboard:
    <<: *app
    command:
      - streamlit
      - run
      - src/papertrader/dashboard/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
      - --browser.gatherUsageStats=false
      - --client.toolbarMode=minimal
    ports:
      - "127.0.0.1:8501:8501"   # only this computer can open the dashboard
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
      start_interval: 3s

  backup:
    image: postgres:16-alpine   # the same version as the database, so pg_dump always matches
    restart: unless-stopped
    logging: *logging
    environment:
      PGHOST: db
      PGUSER: papertrader
      PGPASSWORD: ${POSTGRES_PASSWORD:-change-me}
      PGDATABASE: papertrader
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
      BACKUP_DIR: /backups
      DATA_DIR: /data
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
      - appdata:/data
      - ./scripts:/scripts:ro
    # Strip Windows line endings, just in case, then run the daily backup loop.
    entrypoint: ["sh", "-c", "tr -d '\\r' < /scripts/backup.sh > /tmp/backup.sh && exec sh /tmp/backup.sh"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  appdata:
